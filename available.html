<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Available Homes — MVP Rentals</title>
<style>
:root { --green:#1F6224; --green-dark:#174d1c; --gold:#C8990A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #07120a; color: #fff; padding: 40px 24px 80px; }
.wrap { max-width: 1100px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }
header a { color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: none; letter-spacing: 0.5px; }
header a:hover { color: var(--gold); }
header .brand { color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 0.6px; }
header .brand-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
.nav-logo { height: 36px; width: auto; vertical-align: middle; margin-right: 10px; border-radius: 50%; }
.hero-info { background: rgba(5,18,7,0.86); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 22px 26px; margin-bottom: 30px; }
.hero-info h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.hero-info .dates { color: var(--gold); font-size: 15px; font-weight: 600; letter-spacing: 0.4px; }
.hero-info .nights { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 4px; }
.hero-info .change-link { color: rgba(255,255,255,0.6); font-size: 12px; text-decoration: underline; margin-top: 10px; display: inline-block; }
.hero-info .change-link:hover { color: var(--gold); }

.summary { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 18px; }
.summary strong { color: var(--gold); font-weight: 700; }
.empty-state { background: rgba(5,18,7,0.86); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; padding: 30px; text-align: center; color: rgba(255,255,255,0.7); margin-top: 24px; }
.empty-state h2 { color: #fff; font-size: 20px; margin-bottom: 10px; }
.empty-state a { color: var(--gold); text-decoration: underline; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.card { background: rgba(5,18,7,0.86); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 12px 30px rgba(200,153,10,0.2); }
.card img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
.card .card-body { padding: 16px 20px 18px; }
.card .name { font-size: 19px; font-weight: 800; color: #fff; }
.card .addr { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 3px; }
.card .cta { margin-top: 12px; color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }

.bottom-links { text-align: center; margin-top: 50px; font-size: 11px; color: rgba(255,255,255,0.5); }
.bottom-links a { color: rgba(255,255,255,0.7); text-decoration: none; margin: 0 10px; }
.bottom-links a:hover { color: var(--gold); }

@media (max-width: 600px) {
  body { padding: 24px 16px 60px; }
  .hero-info { padding: 18px 20px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="brand-wrap" href="index.html"><img class="nav-logo" src="assets/logo.webp" alt="MVP Rentals"><span class="brand">MVP Rentals</span></a>
    <a href="index.html">&larr; Change dates</a>
  </header>

  <div class="hero-info">
    <h1>Available homes</h1>
    <div class="dates" id="dateLine"></div>
    <div class="nights" id="nightsLine"></div>
    <a class="change-link" href="index.html">Change dates</a>
  </div>

  <div class="summary" id="summary">Loading availability...</div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h2>No homes open for those dates</h2>
    <p>Try a different range or text us at (610) 621-0769 and we will see what we can do.</p>
    <p style="margin-top:12px;"><a href="index.html">&larr; Pick different dates</a></p>
  </div>
</div>

<div class="bottom-links">
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
  <a href="mailto:wm.m.morris@gmail.com">Contact</a>
</div>

<script src="assets/config.js"></script>
<script>
(function () {
  function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function pretty(s) { var d = parseYmd(s); return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' }); }
  function nights(a,b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
  function rangeOverlapsBooked(ci, co, ranges) {
    var a = parseYmd(ci), b = parseYmd(co);
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i]; if (!r || r.length < 2) continue;
      var ra = parseYmd(r[0]), rb = parseYmd(r[1]);
      if (a < rb && ra < b) return true;
    }
    return false;
  }

  var qs = new URLSearchParams(window.location.search);
  var ci = qs.get('checkIn');
  var co = qs.get('checkOut');
  var guests = parseInt(qs.get('guests') || '0', 10);
  var needGame = qs.get('gameRoom') === '1';
  var needTheater = qs.get('theater') === '1';
  var dateLine = document.getElementById('dateLine');
  var nightsLine = document.getElementById('nightsLine');
  var summary = document.getElementById('summary');
  var grid = document.getElementById('grid');
  var emptyState = document.getElementById('emptyState');

  if (!ci || !co || ci >= co) {
    dateLine.textContent = 'No dates selected';
    summary.style.display = 'none';
    emptyState.style.display = 'block';
    emptyState.querySelector('h2').textContent = 'Pick check-in and check-out first';
    emptyState.querySelector('p').textContent = '';
    return;
  }

  dateLine.textContent = pretty(ci) + '  >  ' + pretty(co);
  nightsLine.textContent = nights(ci, co) + ' nights' + (guests > 0 ? ' ? ' + guests + ' guests' : '');

  var endpoint = (window.SITE_CONFIG && window.SITE_CONFIG.endpoints && window.SITE_CONFIG.endpoints.availability) || '';
  var fetchP;
  if (!endpoint || endpoint.indexOf('@') === 0) {
    fetchP = Promise.resolve({});
  } else {
    fetchP = fetch(endpoint).then(function(r){return r.json();}).catch(function(){return {};});
  }

  fetchP.then(function (avail) {
    var props = (window.SITE_CONFIG && window.SITE_CONFIG.properties) || [];
    var available = props.filter(function (p) {
      var booked = avail[p.name] || [];
      if (rangeOverlapsBooked(ci, co, booked)) return false;
      if (guests > 0 && Number(p.maxGuests) < guests) return false;
      var amenities = p.included || [];
      if (needGame && !amenities.some(function(a){return /game|arcade/i.test(a);})) return false;
      if (needTheater && !amenities.some(function(a){return /theater/i.test(a);})) return false;
      return true;
    });

    if (!available.length) {
      summary.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    var hdr = '<strong>' + available.length + ' of ' + props.length + '</strong> homes open' + (guests > 0 ? ' that fit ' + guests + ' guest' + (guests===1?'':'s') : '') + '. Click any to see details and book.'; summary.innerHTML = hdr;

    available.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = p.slug + '/?checkIn=' + ci + '&checkOut=' + co + (guests > 0 ? '&guests=' + guests : '');
      a.style.borderLeftColor = p.color;
      a.innerHTML =
        '<img src="' + p.heroPhoto + '" alt="' + p.name + '" loading="lazy">' +
        '<div class="card-body">' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="addr">' + p.address + ' ? sleeps ' + p.maxGuests + '</div>' +
          '<div class="cta">View details &amp; book &rarr;</div>' +
        '</div>';
      grid.appendChild(a);
    });
  });
})();
</script>

</body>
</html>
