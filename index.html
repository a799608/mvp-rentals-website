<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVP Rentals — Direct Booking</title>
<meta name="description" content="MVP Rentals direct-booking site for our six Pocono homes. Pick your dates and see which homes are available.">
<style>
:root {
  --green:       #1F6224;
  --green-light: #D6E8D6;
  --green-dark:  #174d1c;
  --gold:        #C8990A;
  --gold-bg:     #FDF3D0;
  --cream:       #E1E6C4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #07120a; color: #fff; }

#phase-landing { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.prop-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
.prop-cell { position: relative; overflow: hidden; transition: all 0.7s ease; cursor: default; }
.prop-cell::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.48); z-index: 1; transition: background 0.7s ease; }
.prop-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.8s ease; }
.prop-cell .prop-label { position: absolute; bottom: 36px; left: 0; right: 0; color: #fff; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; padding: 4px 8px; text-align: center; z-index: 2; transition: color 0.5s, opacity 0.5s; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }
.prop-cell.dimmed::before { background: rgba(0,0,0,0.75); }
.prop-cell.dimmed .prop-label { opacity: 0.3; }
.prop-cell.highlighted { cursor: pointer; }
.prop-cell.highlighted::before { background: rgba(0,0,0,0.05); }
.prop-cell.highlighted img { transform: scale(1.07); }
.prop-cell.highlighted .prop-label { color: var(--gold); font-size: 12px; letter-spacing: 1.5px; }
.prop-cell.highlighted::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--gold); z-index: 3; pointer-events: none; box-shadow: inset 0 0 20px rgba(200,153,10,0.35); }
.prop-cell.always-clickable { cursor: pointer; }

.landing-card { position: relative; z-index: 10; background: rgba(5,18,7,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.09); border-radius: 22px; padding: 38px 34px 34px; width: 100%; max-width: 460px; margin: 20px; box-shadow: 0 12px 50px rgba(0,0,0,0.55); text-align: center; }
.logo-wrap { position: relative; display: inline-block; width: 90px; height: 90px; margin-bottom: 14px; overflow: visible; }
.logo-wrap img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15); display: block; }
.landing-card h1 { color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 0.8px; margin-bottom: 3px; font-family: 'Segoe UI', Arial, sans-serif; }
.landing-tagline { color: rgba(255,255,255,0.55); font-size: 12px; margin-bottom: 18px; letter-spacing: 0.4px; }

.stats-row { display: flex; justify-content: center; gap: 0; margin-bottom: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
.stat { flex: 1; padding: 10px 4px; border-right: 1px solid rgba(255,255,255,0.08); text-align: center; }
.stat:last-child { border-right: none; }
.stat-num { font-size: 21px; font-weight: 800; color: var(--gold); line-height: 1.1; }
.stat-lbl { font-size: 9px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.input-lbl { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.6px; text-align: left; margin-bottom: 6px; }
.date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.date-row > div { text-align: left; }
.date-input { width: 100%; padding: 11px 12px; border: 1.5px solid rgba(255,255,255,0.18); border-radius: 10px; font-size: 14px; font-family: 'Segoe UI', Arial, sans-serif; background: rgba(255,255,255,0.08); color: #fff; transition: all 0.2s; }
.date-input::-webkit-calendar-picker-indicator { filter: invert(0.85); cursor: pointer; }
.date-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,153,10,0.2); background: rgba(255,255,255,0.12); }
.avail-hint { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 4px; min-height: 16px; line-height: 1.5; }
.avail-hint.ok { color: #b6e2b6; }
.avail-hint.warn { color: #ffd0a8; }
.avail-hint.err { color: #ff8080; }

.bottom-links { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; z-index: 11; font-size: 11px; color: rgba(255,255,255,0.7); padding: 24px 0 12px; background: linear-gradient(to bottom, rgba(7,18,10,0) 0%, rgba(7,18,10,0.85) 60%, rgba(7,18,10,0.95) 100%); pointer-events: none; }
.bottom-links a { color: rgba(255,255,255,0.85); text-decoration: none; margin: 0 12px; pointer-events: auto; }
.bottom-links a:hover { color: var(--gold); }

@media (max-width: 480px) {
  .landing-card { padding: 26px 18px 22px; }
  .landing-card h1 { font-size: 22px; }
  .date-row { grid-template-columns: 1fr; }
}

.avail-hint.actionable { color: var(--gold); cursor: pointer; text-decoration: underline; font-weight: 600; }
.avail-hint.actionable:hover { color: #fff; }
.avail-list { display: none; margin-top: 12px; max-height: 240px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; text-align: left; }
.avail-list.shown { display: block; }
.avail-list .item { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
.avail-list .item:hover { background: rgba(255,255,255,0.08); }
.avail-list .item img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
.avail-list .item .name { font-size: 14px; font-weight: 700; color: #fff; }
.avail-list .item .meta { font-size: 11px; color: rgba(255,255,255,0.55); }
.avail-list .item .go { color: var(--gold); font-size: 12px; margin-left: auto; }

.filter-chip { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; color: rgba(255,255,255,0.85); font-size: 13px; cursor: pointer; user-select: none; transition: all 0.15s; }
.filter-chip:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); }
.filter-chip input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; cursor: pointer; }

.logo-wrap { position: relative; }
.snowflake { position: absolute; color: rgba(220,240,255,0.9); font-size: 9px; opacity: 0; animation: snowfall linear infinite; pointer-events: none; z-index: 20; text-shadow: 0 0 4px rgba(255,255,255,0.7); }
@keyframes snowfall { 0% { transform: translateY(-8px) rotate(0deg); opacity: 0.9; } 80% { opacity: 0.6; } 100% { transform: translateY(100px) rotate(180deg); opacity: 0; } }

.value-props { display: flex; justify-content: center; gap: 14px; margin: 4px 0 18px; flex-wrap: wrap; }
.value-prop { font-size: 11px; color: rgba(255,255,255,0.7); letter-spacing: 0.4px; text-transform: uppercase; font-weight: 600; }
.value-prop::before { content: '•'; color: var(--gold); margin-right: 6px; }
/* Union calendar (homepage) */
.union-cal-block { margin: 18px 0 12px; text-align: left; }
.union-cal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.union-cal-summary { font-size: 12px; color: rgba(255,255,255,0.65); }
.union-cal-host .union-cal-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.union-cal-host .union-cal-nav { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 18px; line-height: 1; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
.union-cal-host .union-cal-nav:hover:not(:disabled) { background: rgba(200,153,10,0.25); border-color: var(--gold); }
.union-cal-host .union-cal-nav:disabled { opacity: 0.35; cursor: not-allowed; }
.union-cal-host .union-cal-month-label { font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; flex: 1; text-align: center; }
.union-cal-host .calendar-month { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 10px 8px 12px; }
.union-cal-host .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.union-cal-host .cal-dow { font-size: 10px; text-align: center; color: rgba(255,255,255,0.55); padding: 3px 0; font-weight: 700; letter-spacing: 0.5px; }
.union-cal-host .cal-cell { aspect-ratio: 1 / 1; min-height: 32px; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 5px; background: #1a2418; color: rgba(255,255,255,0.92); cursor: pointer; transition: background 0.15s, transform 0.05s, border-color 0.15s; user-select: none; border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
.union-cal-host .cal-cell .day { font-weight: 600; line-height: 1; }
.union-cal-host .cal-cell.empty { background: transparent; cursor: default; border-color: transparent; box-shadow: none; }
.union-cal-host .cal-cell:hover:not(.empty):not(.booked):not(.past) { background: rgba(200,153,10,0.30); border-color: var(--gold); }
.union-cal-host .cal-cell.booked { background: #0d130d; color: rgba(255,255,255,0.22); cursor: not-allowed; pointer-events: none; border-color: rgba(255,255,255,0.05); }
.union-cal-host .cal-cell.booked .day { text-decoration: line-through; }
.union-cal-host .cal-cell.past { background: rgba(255,255,255,0.025); color: rgba(255,255,255,0.32); border-color: rgba(255,255,255,0.06); cursor: not-allowed; pointer-events: none; opacity: 1; }
.union-cal-host .cal-cell.in-range { background: rgba(200,153,10,0.28); border-color: rgba(200,153,10,0.55); }
.union-cal-host .cal-cell.endpoint { background: var(--gold); color: #07120a; border-color: #fff; box-shadow: 0 0 0 1px var(--gold); }
.union-cal-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.6); }
.union-cal-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,0.15); }
@media (max-width: 480px) {
  .union-cal-host .cal-cell { font-size: 13px; min-height: 36px; }
}

/* Start-Your-Trip submit-flow additions */
.start-trip-btn { display: block; width: 100%; margin: 14px 0 6px; padding: 14px 18px; background: var(--gold); color: #07120a; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; cursor: pointer; transition: background 0.15s, transform 0.05s, box-shadow 0.15s; box-shadow: 0 4px 14px rgba(200,153,10,0.35); font-family: 'Segoe UI', Arial, sans-serif; }
.start-trip-btn:hover { background: #e0ad15; box-shadow: 0 6px 18px rgba(200,153,10,0.5); }
.start-trip-btn:active { transform: translateY(1px); }
.start-trip-btn:disabled { background: rgba(200,153,10,0.4); cursor: wait; box-shadow: none; }
.avail-hint.err { color: #ff8080; }
/* Modal fade-out */
.landing-card { transition: opacity 0.45s ease, transform 0.45s ease; }
.landing-card.fading-out { opacity: 0; transform: scale(0.96) translateY(-8px); pointer-events: none; }
.landing-card.hidden { display: none !important; }
/* Tile result classes — applied after Start Your Trip submit */
.prop-cell.result-available { cursor: pointer; }
.prop-cell.result-available::before { background: rgba(0,0,0,0.05); }
.prop-cell.result-available img { transform: scale(1.07); }
.prop-cell.result-available .prop-label { color: var(--gold); font-size: 12px; letter-spacing: 1.5px; opacity: 1; }
.prop-cell.result-available::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--gold); z-index: 3; pointer-events: none; box-shadow: inset 0 0 20px rgba(200,153,10,0.35); }
.prop-cell.result-unavailable { cursor: not-allowed; opacity: 0.3; }
.prop-cell.result-unavailable::before { background: rgba(0,0,0,0.78); }
.prop-cell.result-unavailable img { transform: none; filter: grayscale(0.4); }
.prop-cell.result-unavailable .prop-label { color: rgba(255,255,255,0.5); }
/* Floating "Change dates" button shown after submit */
.change-dates-btn { position: fixed; top: 18px; right: 18px; z-index: 50; background: rgba(5,18,7,0.86); color: var(--gold); border: 1.5px solid var(--gold); border-radius: 24px; padding: 10px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 18px rgba(0,0,0,0.45); display: none; opacity: 0; transition: opacity 0.35s ease, background 0.15s, color 0.15s; font-family: 'Segoe UI', Arial, sans-serif; }
.change-dates-btn.shown { display: inline-block; opacity: 1; }
.change-dates-btn:hover { background: var(--gold); color: #07120a; }
.change-dates-btn .icon { margin-right: 6px; font-size: 14px; }
/* Result summary line under "Change dates" button */
.result-summary { position: fixed; top: 60px; right: 18px; z-index: 49; font-size: 12px; color: rgba(255,255,255,0.85); background: rgba(5,18,7,0.78); border-radius: 14px; padding: 6px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; max-width: 260px; text-align: right; }
.result-summary.shown { display: inline-block; }
@media (max-width: 480px) {
  .change-dates-btn { top: 12px; right: 12px; padding: 8px 14px; font-size: 12px; }
  .result-summary { top: 50px; right: 12px; font-size: 11px; max-width: 200px; }
}


/* Popover calendar for the homepage Check-in / Check-out trigger boxes. */
.date-row { position: relative; }
.date-input { cursor: pointer; }
.date-input::placeholder { color: rgba(255,255,255,0.55); }
.date-input.has-value { color: #fff; }
.date-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,153,10,0.2); background: rgba(255,255,255,0.12); }
.date-input.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,153,10,0.2); background: rgba(255,255,255,0.12); }

.popover-cal { position: absolute; z-index: 60; left: 0; top: 100%; margin-top: 8px; width: 320px; max-width: calc(100vw - 32px); background: rgba(8,22,11,0.97); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 12px 10px; box-shadow: 0 12px 36px rgba(0,0,0,0.55); display: none; }
.popover-cal.open { display: block; }
.popover-cal .union-cal-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.popover-cal .union-cal-nav { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #fff; font-size: 18px; line-height: 1; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
.popover-cal .union-cal-nav:hover:not(:disabled) { background: rgba(200,153,10,0.25); border-color: var(--gold); }
.popover-cal .union-cal-nav:disabled { opacity: 0.35; cursor: not-allowed; }
.popover-cal .union-cal-month-label { font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; flex: 1; text-align: center; }
.popover-cal .calendar-month { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 10px 8px 12px; }
.popover-cal .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.popover-cal .cal-dow { font-size: 10px; text-align: center; color: rgba(255,255,255,0.55); padding: 3px 0; font-weight: 700; letter-spacing: 0.5px; }
.popover-cal .cal-cell { aspect-ratio: 1 / 1; min-height: 32px; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 5px; background: #1a2418; color: rgba(255,255,255,0.92); cursor: pointer; transition: background 0.15s, transform 0.05s, border-color 0.15s; user-select: none; border: 1px solid rgba(255,255,255,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
.popover-cal .cal-cell .day { font-weight: 600; line-height: 1; }
.popover-cal .cal-cell.empty { background: transparent; cursor: default; border-color: transparent; box-shadow: none; }
.popover-cal .cal-cell:hover:not(.empty):not(.booked):not(.past):not(.disabled) { background: rgba(200,153,10,0.30); border-color: var(--gold); }
.popover-cal .cal-cell.booked { background: #0d130d; color: rgba(255,255,255,0.22); cursor: not-allowed; pointer-events: none; border-color: rgba(255,255,255,0.05); }
.popover-cal .cal-cell.booked .day { text-decoration: line-through; }
.popover-cal .cal-cell.past { background: rgba(255,255,255,0.025); color: rgba(255,255,255,0.32); border-color: rgba(255,255,255,0.06); cursor: not-allowed; pointer-events: none; opacity: 1; }
.popover-cal .cal-cell.disabled { background: rgba(255,255,255,0.02); color: rgba(255,255,255,0.30); cursor: not-allowed; pointer-events: none; }
.popover-cal .cal-cell.in-range { background: rgba(200,153,10,0.28); border-color: rgba(200,153,10,0.55); }
.popover-cal .cal-cell.endpoint { background: var(--gold); color: #07120a; border-color: #fff; box-shadow: 0 0 0 1px var(--gold); }
.popover-cal .union-cal-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; font-size: 10px; color: rgba(255,255,255,0.6); }
.popover-cal .union-cal-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,0.15); }
@media (max-width: 480px) {
  .popover-cal { width: calc(100vw - 40px); left: 50%; transform: translateX(-50%); }
  .popover-cal .cal-cell { font-size: 13px; min-height: 36px; }
}

</style>
</head>
<body>

<div id="phase-landing">
  <div class="prop-grid" id="propGrid">
    <div class="prop-cell" data-prop="Trails" data-slug="trails">
      <img src="https://a799608.github.io/mvp-guest-guides/trails/hero.jpg?v=2f86b72" alt="Trails" loading="eager">
      <div class="prop-label">Trails</div>
    </div>
    <div class="prop-cell" data-prop="Milton" data-slug="milton">
      <img src="https://a799608.github.io/mvp-guest-guides/milton/hero.jpg?v=2f86b72" alt="Milton" loading="eager">
      <div class="prop-label">Milton</div>
    </div>
    <div class="prop-cell" data-prop="MacCauley" data-slug="maccauley">
      <img src="https://a799608.github.io/mvp-guest-guides/maccauley/hero.jpg?v=2f86b72" alt="MacCauley" loading="eager">
      <div class="prop-label">MacCauley</div>
    </div>
    <div class="prop-cell" data-prop="Pound" data-slug="pound">
      <img src="https://a799608.github.io/mvp-guest-guides/pound/hero.jpg?v=2f86b72" alt="Pound" loading="eager">
      <div class="prop-label">Pound</div>
    </div>
    <div class="prop-cell" data-prop="Wylie" data-slug="wylie">
      <img src="https://a799608.github.io/mvp-guest-guides/wylie/hero.jpg?v=2f86b72" alt="Wylie" loading="eager">
      <div class="prop-label">Wylie</div>
    </div>
    <div class="prop-cell" data-prop="Petrarch" data-slug="petrarch">
      <img src="https://a799608.github.io/mvp-guest-guides/petrarch/hero.jpg?v=2f86b72" alt="Petrarch" loading="eager">
      <div class="prop-label">Petrarch</div>
    </div>

    <h1>MVP Rentals</h1>
    <p class="landing-tagline">Poconos, Pennsylvania &nbsp;&middot;&nbsp; Premier Vacation Homes</p>

    <div class="value-props">
      <span class="value-prop">No service fees</span>
      <span class="value-prop">Pet friendly</span>
      <span class="value-prop">Direct from owner</span>
    </div>

    <div class="date-row">
      <div>
        <div class="input-lbl">Check-in</div>
        <input type="text" id="checkInInput" class="date-input" readonly placeholder="Select date" autocomplete="off" aria-haspopup="dialog">
      </div>
      <div>
        <div class="input-lbl">Check-out</div>
        <input type="text" id="checkOutInput" class="date-input" readonly placeholder="Select date" autocomplete="off" aria-haspopup="dialog">
      </div>
      <div id="datePopover" class="popover-cal" aria-hidden="true"></div>
    </div>
    <div class="date-row" style="grid-template-columns: 1fr;">
      <div>
        <div class="input-lbl">Group size</div>
        <input type="number" id="guestsInput" class="date-input" min="1" max="14" placeholder="How many guests?">
      </div>
    </div>
    <div class="date-row" style="grid-template-columns: 1fr 1fr;">
      <label class="filter-chip"><input type="checkbox" id="filterGameRoom"> <span>Game room</span></label>
      <label class="filter-chip"><input type="checkbox" id="filterTheater"> <span>Theater room</span></label>
    </div>
    <button type="button" class="start-trip-btn" id="startTripBtn">Start Your Trip &rarr;</button>
    <div class="avail-hint" id="availHint">Pick your dates &mdash; we&rsquo;ll light up the homes that are open.</div>
  </div>
</div>

<button type="button" class="change-dates-btn" id="changeDatesBtn"><span class="icon">&larr;</span>Change dates</button>
<div class="result-summary" id="resultSummary"></div>

<div class="bottom-links">
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
  <a href="mailto:wm.m.morris@gmail.com">Contact</a>
</div>

<script src="assets/config.js?v=4777107"></script>
<script src="assets/calendar.js?v=4777107"></script>
<script>
(function () {
  var GAS_URL = window.SITE_CONFIG && window.SITE_CONFIG.endpoints && window.SITE_CONFIG.endpoints.availability;
  var checkInEl = document.getElementById('checkInInput');
  var checkOutEl = document.getElementById('checkOutInput');
  var hintEl = document.getElementById('availHint');
  var grid = document.getElementById('propGrid');
  var allCells = Array.from(grid.querySelectorAll('.prop-cell'));
  var startBtn = document.getElementById('startTripBtn');
  var changeBtn = document.getElementById('changeDatesBtn');
  var summaryFloat = document.getElementById('resultSummary');
  var landingCard = document.querySelector('.landing-card');

  var availabilityCache = null;
  var fetchPromise = null;
  var hasResult = false; // true once Start Your Trip has been clicked successfully

  function ymdToday() { var d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
  function fmt(d) { return d.toISOString().slice(0,10); }
  function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate()+n); return x; }

  // (Date min/max no longer needed; inputs are read-only text triggers.)

  function fetchAvailability() {
    if (availabilityCache) return Promise.resolve(availabilityCache);
    if (fetchPromise) return fetchPromise;
    if (!GAS_URL || GAS_URL.indexOf('@') === 0) return Promise.resolve({});
    fetchPromise = fetch(GAS_URL).then(function (r) { return r.json(); }).then(function (j) {
      availabilityCache = j; return j;
    }).catch(function () { return {}; });
    return fetchPromise;
  }

  function rangeOverlapsBooked(checkIn, checkOut, bookedRanges) {
    var ci = parseYmd(checkIn), co = parseYmd(checkOut);
    for (var i = 0; i < bookedRanges.length; i++) {
      var b = bookedRanges[i];
      if (!b || b.length < 2) continue;
      var bci = parseYmd(b[0]), bco = parseYmd(b[1]);
      if (ci < bco && bci < co) return true;
    }
    return false;
  }

  function clearStateClasses() {
    allCells.forEach(function (c) {
      c.classList.remove('dimmed');
      c.classList.remove('highlighted');
      c.classList.remove('always-clickable');
      c.classList.remove('result-available');
      c.classList.remove('result-unavailable');
    });
  }

  function showAlwaysClickable() {
    clearStateClasses();
    allCells.forEach(function (c) { c.classList.add('always-clickable'); });
  }

  function setHint(cls, text) {
    hintEl.className = 'avail-hint' + (cls ? ' ' + cls : '');
    hintEl.textContent = text;
  }

  function navigateToCell(cell) {
    if (cell.classList.contains('result-unavailable')) return;
    var slug = cell.getAttribute('data-slug');
    var ci = checkInEl.dataset.ymd || '', co = checkOutEl.dataset.ymd || '';
    var qs = '';
    if (ci && co && ci < co) {
      qs = '?checkIn=' + ci + '&checkOut=' + co;
      var g = parseInt(document.getElementById('guestsInput').value || '0', 10);
      if (g > 0) qs += '&guests=' + g;
    }
    window.location.href = slug + '/' + qs;
  }

  allCells.forEach(function (cell) {
    cell.addEventListener('click', function () {
      if (cell.classList.contains('result-unavailable')) return;
      if (cell.classList.contains('result-available') ||
          cell.classList.contains('always-clickable')) {
        navigateToCell(cell);
      }
    });
  });

  function fmtRange(ci, co) {
    if (!ci || !co) return '';
    var a = parseYmd(ci), b = parseYmd(co);
    var nights = Math.round((b - a) / (1000*60*60*24));
    var opts = { month: 'short', day: 'numeric' };
    return a.toLocaleDateString('en-US', opts) + ' \u2192 ' + b.toLocaleDateString('en-US', opts) + ' (' + nights + ' night' + (nights === 1 ? '' : 's') + ')';
  }

  function applyResults(avail) {
    var ci = checkInEl.dataset.ymd || '', co = checkOutEl.dataset.ymd || '';
    var guests = parseInt(document.getElementById('guestsInput').value || '0', 10);
    var needGame = document.getElementById('filterGameRoom').checked;
    var needTheater = document.getElementById('filterTheater').checked;
    var availableCount = 0;
    var availableNames = [];
    allCells.forEach(function (cell) {
      cell.classList.remove('dimmed','highlighted','always-clickable',
                             'result-available','result-unavailable');
      var name = cell.getAttribute('data-prop');
      var slug = cell.getAttribute('data-slug');
      var prop = window.SITE_CONFIG.getProperty(slug);
      var maxG = prop ? Number(prop.maxGuests) : 99;
      var booked = (avail[name] || []);
      var conflict = rangeOverlapsBooked(ci, co, booked);
      var tooSmall = guests > 0 && maxG < guests;
      var amenities = (prop && prop.included) || [];
      var hasGame = amenities.some(function (a) { return /game|arcade/i.test(a); });
      var hasTheater = amenities.some(function (a) { return /theater/i.test(a); });
      var missingAmenity = (needGame && !hasGame) || (needTheater && !hasTheater);
      if (conflict || tooSmall || missingAmenity) {
        cell.classList.add('result-unavailable');
      } else {
        cell.classList.add('result-available');
        availableCount++;
        availableNames.push(name);
      }
    });
    return { count: availableCount, names: availableNames };
  }

  function showResultSummary(result) {
    var ci = checkInEl.dataset.ymd || '', co = checkOutEl.dataset.ymd || '';
    var dateStr = fmtRange(ci, co);
    var line = result.count + ' of 6 homes open \u2014 ' + dateStr;
    if (result.count === 0) {
      line = 'No homes match \u2014 ' + dateStr;
    }
    summaryFloat.textContent = line;
    summaryFloat.classList.add('shown');
  }

  function hideModal() {
    landingCard.classList.add('fading-out');
    setTimeout(function () {
      landingCard.classList.add('hidden');
      changeBtn.classList.add('shown');
    }, 460);
  }

  function showModal() {
    landingCard.classList.remove('hidden');
    // Force reflow before removing fading-out so the transition runs.
    void landingCard.offsetWidth;
    landingCard.classList.remove('fading-out');
    changeBtn.classList.remove('shown');
    summaryFloat.classList.remove('shown');
    showAlwaysClickable();
    hasResult = false;
    setHint('', 'Pick your dates \u2014 we\u2019ll light up the homes that are open.');
  }

  function handleStartTrip() {
    var ci = checkInEl.dataset.ymd || '', co = checkOutEl.dataset.ymd || '';
    if (!ci || !co || ci >= co) {
      setHint('err', 'Please pick check-in and check-out dates');
      return;
    }
    setHint('', 'Checking availability\u2026');
    startBtn.disabled = true;
    var oldLabel = startBtn.textContent;
    startBtn.textContent = 'Checking\u2026';
    fetchAvailability().then(function (avail) {
      var result = applyResults(avail || {});
      hasResult = true;
      showResultSummary(result);
      hideModal();
      startBtn.disabled = false;
      startBtn.textContent = oldLabel;
    }).catch(function () {
      // Even on fetch fail, treat all as available (calendar already filtered fully-booked nights).
      var result = applyResults({});
      hasResult = true;
      showResultSummary(result);
      hideModal();
      startBtn.disabled = false;
      startBtn.textContent = oldLabel;
    });
  }

  startBtn.addEventListener('click', handleStartTrip);
  changeBtn.addEventListener('click', showModal);

  // When user changes dates/guests/amenities AFTER a result is showing,
  // do NOT silently re-render tiles — they must press Start Your Trip again.
  // But clear any stale error hint.
  function clearErrorOnInput() {
    if (hintEl.classList.contains('err')) {
      setHint('', 'Pick your dates \u2014 we\u2019ll light up the homes that are open.');
    }
  }
  checkInEl.addEventListener('change', clearErrorOnInput);
  checkOutEl.addEventListener('change', clearErrorOnInput);
  document.getElementById('guestsInput').addEventListener('input', clearErrorOnInput);
  document.getElementById('filterGameRoom').addEventListener('change', clearErrorOnInput);
  document.getElementById('filterTheater').addEventListener('change', clearErrorOnInput);

  // Allow Enter in any modal field to trigger Start Your Trip.
  landingCard.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleStartTrip();
    }
  });

  showAlwaysClickable();

  function createSnowflakes() {
    var wrap = document.getElementById('logoWrap');
    if (!wrap) return;
    var glyphs = ['\u2744', '\u2745', '\u2746', '\u2022', '\u00b7', '\u2726'];
    for (var i = 0; i < 14; i++) {
      var sf = document.createElement('span');
      sf.className   = 'snowflake';
      sf.textContent = glyphs[i % glyphs.length];
      sf.style.left              = (Math.random() * 88 + 6) + '%';
      sf.style.fontSize          = (7 + Math.random() * 7) + 'px';
      sf.style.animationDuration = (2.5 + Math.random() * 3.5) + 's';
      sf.style.animationDelay    = (Math.random() * 5) + 's';
      wrap.appendChild(sf);
    }
  }
  createSnowflakes();

  // Popover-mode union calendar attached to the Check-in / Check-out boxes.
  (function bootUnionPopover() {
    var popover = document.getElementById('datePopover');
    if (!popover || !window.MVPCalendar || !window.MVPCalendar.createUnionPopover) return;
    var props = (window.SITE_CONFIG && window.SITE_CONFIG.properties) || [];
    var names = props.map(function (p) { return p.name; });

    // Hidden state (the underlying YYYY-MM-DD strings).
    var state = { checkIn: '', checkOut: '' };

    function fmtDisplay(ymdStr) {
      if (!ymdStr) return '';
      var p = ymdStr.split('-').map(Number);
      var d = new Date(p[0], p[1] - 1, p[2]);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    function syncInputs() {
      checkInEl.value = state.checkIn ? fmtDisplay(state.checkIn) : '';
      checkOutEl.value = state.checkOut ? fmtDisplay(state.checkOut) : '';
      checkInEl.setAttribute('data-ymd', state.checkIn || '');
      checkOutEl.setAttribute('data-ymd', state.checkOut || '');
      checkInEl.classList.toggle('has-value', !!state.checkIn);
      checkOutEl.classList.toggle('has-value', !!state.checkOut);
      // Backwards-compat: many helpers in this file read checkInEl.value as YMD.
      // We expose the raw YMD via .dataset.ymd; override .value getter is heavy.
      // Instead store YMD in a parallel hidden field-like prop:
      Object.defineProperty(checkInEl, 'ymdValue', { value: state.checkIn || '', configurable: true });
      Object.defineProperty(checkOutEl, 'ymdValue', { value: state.checkOut || '', configurable: true });
    }

    var cal = window.MVPCalendar.createUnionPopover({
      container: popover,
      endpoint: GAS_URL,
      propertyNames: names,
      getCheckIn: function () { return state.checkIn || null; },
      getCheckOut: function () { return state.checkOut || null; },
      onPick: function (info) {
        if (info.field === 'checkIn') {
          state.checkIn = info.date;
          // If the new check-in is on/after the existing check-out, clear check-out.
          if (state.checkOut && state.checkOut <= state.checkIn) state.checkOut = '';
          syncInputs();
          clearErrorOnInput();
          closePopover();
        } else {
          state.checkOut = info.date;
          syncInputs();
          clearErrorOnInput();
          closePopover();
        }
      },
      onLoaded: function (info) { window.__unionBookedSet = info.bookedSet; },
    });

    var openField = null;

    function anchorPopover(triggerEl) {
      // popover is inside .date-row (relative). Position it under the trigger.
      var row = popover.parentElement;
      var rowRect = row.getBoundingClientRect();
      var trigRect = triggerEl.getBoundingClientRect();
      var leftPx = trigRect.left - rowRect.left;
      // On wide rows (two columns) anchor under that column; on narrow rows
      // just let the default centering CSS handle it.
      if (window.innerWidth > 480) {
        popover.style.left = leftPx + 'px';
        popover.style.transform = 'none';
      } else {
        popover.style.left = '';
        popover.style.transform = '';
      }
    }

    function openPopover(field) {
      openField = field;
      var trigger = field === 'checkIn' ? checkInEl : checkOutEl;
      checkInEl.classList.toggle('active', field === 'checkIn');
      checkOutEl.classList.toggle('active', field === 'checkOut');
      cal.setActiveField(field);
      // Jump to month containing existing selection (or today).
      if (field === 'checkIn' && state.checkIn) cal.jumpToMonthOf(state.checkIn);
      else if (field === 'checkOut' && (state.checkOut || state.checkIn)) cal.jumpToMonthOf(state.checkOut || state.checkIn);
      else cal.jumpToToday();
      anchorPopover(trigger);
      popover.classList.add('open');
      popover.setAttribute('aria-hidden', 'false');
    }

    function closePopover() {
      openField = null;
      checkInEl.classList.remove('active');
      checkOutEl.classList.remove('active');
      popover.classList.remove('open');
      popover.setAttribute('aria-hidden', 'true');
    }

    function toggleFor(field) {
      if (popover.classList.contains('open') && openField === field) closePopover();
      else openPopover(field);
    }

    checkInEl.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      toggleFor('checkIn');
    });
    checkOutEl.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      toggleFor('checkOut');
    });

    // Outside-click closes the popover.
    document.addEventListener('mousedown', function (e) {
      if (!popover.classList.contains('open')) return;
      if (popover.contains(e.target) || e.target === checkInEl || e.target === checkOutEl) return;
      closePopover();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && popover.classList.contains('open')) closePopover();
    });

    // Re-anchor on resize while open.
    window.addEventListener('resize', function () {
      if (!popover.classList.contains('open') || !openField) return;
      anchorPopover(openField === 'checkIn' ? checkInEl : checkOutEl);
    });

    // Expose for other handlers.
    window.__unionPopoverState = state;
    window.__unionPopoverClose = closePopover;
  })();
})();
</script>

</body>
